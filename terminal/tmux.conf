set -g mouse on
set -g history-limit 50000
set -g default-terminal "screen-256color"
set -g base-index 1
setw -g pane-base-index 1
# đừng tự thoát tmux khi đóng session cuối
# Ani Terminal status bar
set -g status on
set -g status-interval 10
set -g status-style "bg=#1a1b26,fg=#7aa2f7"
set -g status-left "#[bold]>_ PiTerm·#S "
set -g status-right "#(/home/pi/.tmux-status.sh) %H:%M"
set -g status-right-length 60
# ── PiTerm mouse: native-style select + right-click context menu ──
set -g set-clipboard on
# drag chọn text: GIỮ selection (không tự copy, không thoát copy-mode)
bind -T copy-mode MouseDragEnd1Pane send-keys -X stop-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection
# right-click khi ĐANG có selection (trong copy-mode): menu Copy/Cancel
bind -T copy-mode MouseDown3Pane display-menu -O -t= -x M -y M -T "#[bold]PiTerm" \
  "Copy"            c { send-keys -X copy-pipe-and-cancel "wl-copy" } \
  "Copy + Paste"    y { send-keys -X copy-pipe-and-cancel "wl-copy" ; run "sleep 0.1; tmux set-buffer -- \"$(wl-paste -n 2>/dev/null)\"; tmux paste-buffer" } \
  "" \
  "Cancel select"   q { send-keys -X cancel }
bind -T copy-mode-vi MouseDown3Pane display-menu -O -t= -x M -y M -T "#[bold]PiTerm" \
  "Copy"            c { send-keys -X copy-pipe-and-cancel "wl-copy" } \
  "Copy + Paste"    y { send-keys -X copy-pipe-and-cancel "wl-copy" ; run "sleep 0.1; tmux set-buffer -- \"$(wl-paste -n 2>/dev/null)\"; tmux paste-buffer" } \
  "" \
  "Cancel select"   q { send-keys -X cancel }
# right-click bình thường (không selection): menu thao tác chung
bind -n MouseDown3Pane display-menu -O -t= -x M -y M -T "#[bold]PiTerm" \
  "Paste"           p { run "tmux set-buffer -- \"$(wl-paste -n 2>/dev/null)\"; tmux paste-buffer" } \
  "" \
  "New tab"         t { new-window -c "#{pane_current_path}" } \
  "Split ngang"     h { split-window -h -c "#{pane_current_path}" } \
  "Split dọc"       v { split-window -v -c "#{pane_current_path}" } \
  "" \
  "Chọn tab..."     w { choose-tree -Zw } \
  "Zoom pane"       z { resize-pane -Z } \
  "" \
  "Đóng pane"       x { kill-pane }
