set -g mouse on
set -g history-limit 50000
set -g default-terminal "screen-256color"
set -g base-index 1
setw -g pane-base-index 1
# đừng tự thoát tmux khi đóng session cuối
# Ani Terminal status bar
set -g status on
set -g status-interval 10
set -g status-style "bg=#1a1b26,fg=#7aa2f7"
set -g status-left "#[bold]>_ PiTerm·#S "
set -g status-right "#(/home/pi/.tmux-status.sh) %H:%M"
set -g status-right-length 60
# ── Mouse copy/paste (PiTerm) ──
# drag = select; release = copy to system clipboard (wl-copy); right-click = paste
set -g set-clipboard on
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
bind -n MouseDown3Pane run "tmux set-buffer -- \"$(wl-paste -n 2>/dev/null)\"; tmux paste-buffer"
